<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — СвязьТелеком</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📶</text></svg>">
</head>
<body>

  <header class="site-header" data-header="cabinet"></header>

  <div class="wrap app-shell">
    <!-- Боковая панель -->
    <aside class="side">
      <div class="side__user" id="sideUser"></div>
      <nav class="side__nav">
        <button class="side__link is-active" data-section="overview">📊 Обзор</button>
        <button class="side__link" data-section="services">🌐 Мои услуги</button>
        <button class="side__link" data-section="payments">💳 Платежи</button>
        <button class="side__link" data-section="tickets">📨 Обращения</button>
        <button class="side__link" data-section="profile">👤 Профиль</button>
        <hr class="divider" style="margin:10px 0">
        <button class="side__link" id="sideReset">♻️ Сбросить демо-данные</button>
        <button class="side__link" id="logoutBtn" style="color:var(--danger)">🚪 Выйти</button>
      </nav>
    </aside>

    <!-- Рабочая область -->
    <main>
      <div id="view-overview" data-view="overview"></div>
      <div id="view-services" data-view="services" class="hidden"></div>
      <div id="view-payments" data-view="payments" class="hidden"></div>
      <div id="view-tickets" data-view="tickets" class="hidden"></div>
      <div id="view-profile" data-view="profile" class="hidden"></div>
    </main>
  </div>

  <footer class="site-footer" data-footer></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cabinet.js"></script>
</body>
</html>
